name: Verify frozen GraphMS package

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verification dependencies
        run: python -m pip install -r requirements-verify.txt
      - name: Compile evaluator and release tooling
        run: python -m py_compile run_graphms.py scripts/download_release_assets.py scripts/publish_release_assets.py graphms/release_assets.py
      - name: Validate evaluator Colab notebook
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("notebooks/GraphMS_Evaluator_Colab.ipynb")
          nb = json.loads(p.read_text())
          assert nb["nbformat"] == 4
          code_cells = [c for c in nb["cells"] if c.get("cell_type") == "code"]
          assert code_cells, "Evaluator notebook has no code cells"
          for i, cell in enumerate(code_cells):
              compile("".join(cell.get("source", [])), f"{p}:code_cell_{i}", "exec")
          print(f"EVALUATOR NOTEBOOK STATIC PASS: {len(code_cells)} code cells")
          PY
      - name: Verify bundled zero-upload demo inputs
        run: |
          rm -rf /tmp/graphms-demo-inputs
          python scripts/prepare_demo_inputs.py --output-dir /tmp/graphms-demo-inputs
          test -s /tmp/graphms-demo-inputs/MSLesSeg_P10_T1_0000.nii.gz
          test -s /tmp/graphms-demo-inputs/MSLesSeg_P10_T1_0001.nii.gz
          test -s /tmp/graphms-demo-inputs/MSLesSeg_P10_T1_0002.nii.gz
      - name: Verify frozen manifests and audits
        run: python scripts/run_pipeline.py --mode verify
      - name: Replay Stage16 fold aggregation
        run: python scripts/run_pipeline.py --mode evaluation-replay
      - name: Install frozen Stage13 runtime
        run: python -m pip install numpy==2.1.3 scipy==1.14.1 pandas joblib scikit-learn==1.6.1
      - name: Smoke-test frozen Stage13 local inference
        run: python scripts/smoke_stage13.py

  inference-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test runtime
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.1.3 scipy==1.14.1 pandas joblib scikit-learn==1.6.1 nibabel SimpleITK scikit-image matplotlib
      - name: Test frozen source parity and inference contracts
        run: python -m unittest discover -s tests -v
