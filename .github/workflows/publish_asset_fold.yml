name: Publish frozen GraphMS fold asset
on:
  push:
    branches: [publish-frozen-assets]
    paths: [.github/workflows/publish_asset_fold.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FOLD: "0"
      CNN_ID: "1t6cddT9n9Wf-1S4sTBcqw7btrn9lhnHL"
      GAT_ID: "1qNiclYYmYnkEA0V4Llo45Md4DXAgGwmt"
      FUSION_ID: "1ux0Rt11o7xUAegzLzP1q6GRllW-Uhy4_"
      PROTOCOL_SHA: "8944f1a0deef8a7d0eb57118b4b45e3eed0bc803a2c0e93d63d9c9eaba6578a3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download frozen fold artifacts directly from Drive
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet gdown
          mkdir -p assets
          gdown --id "$CNN_ID" -O "assets/resencm250-fold${FOLD}-checkpoint_final.pth"
          gdown --id "$GAT_ID" -O "assets/gat-fold${FOLD}-checkpoint_final.pth"
          gdown --id "$FUSION_ID" -O "assets/fusion-fold${FOLD}-checkpoint_final.pth"
      - name: Check expected sizes and build manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c%s "assets/resencm250-fold${FOLD}-checkpoint_final.pth")" = "819182223"
          test "$(stat -c%s "assets/gat-fold${FOLD}-checkpoint_final.pth")" = "1146875"
          test "$(stat -c%s "assets/fusion-fold${FOLD}-checkpoint_final.pth")" = "1989115"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          fold=int(os.environ["FOLD"])
          mapping={
            f"resencm250-fold{fold}-checkpoint_final.pth":f"resencm250/fold_{fold}/checkpoint_final.pth",
            f"gat-fold{fold}-checkpoint_final.pth":f"gat/fold_{fold}/checkpoint_final.pth",
            f"fusion-fold{fold}-checkpoint_final.pth":f"fusion/fold_{fold}/checkpoint_final.pth",
          }
          files={}
          for name,dest in mapping.items():
              p=Path("assets")/name
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for b in iter(lambda:f.read(1024*1024),b""): h.update(b)
              files[dest]={"asset":name,"sha256":h.hexdigest(),"size_bytes":p.stat().st_size}
          manifest={"schema_version":1,"release_tag":"assets-v1","protocol_sha":os.environ["PROTOCOL_SHA"],"fold":fold,"files":files}
          Path(f"assets/graphms-fold{fold}.json").write_text(json.dumps(manifest,indent=2)+"\n")
          print(json.dumps(manifest,indent=2))
          PY
      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view assets-v1 >/dev/null 2>&1 || gh release create assets-v1 --target main --title "GraphMS-Net frozen neural assets v1" --notes "Frozen GraphMS v3.5.1 Hybrid inference weights. Scientific claim scope remains development five-fold CV."
      - name: Upload fold assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload assets-v1 assets/* --clobber
